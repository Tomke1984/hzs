# Controle bij elke push naar dev of main (en bij pull requests): syntax, statische analyse en de e2e-suite.
# Resultaat: tabblad "Actions" op GitHub, en een groen vinkje of rood kruisje bij elke commit.
name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_sqlite, sodium, mbstring
          coverage: none

      - name: Syntaxcontrole (php -l)
        run: find app public tools db tests -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null

      - name: Statische analyse (PHPStan level 5)
        run: |
          curl -sSL -o /tmp/phpstan.phar https://github.com/phpstan/phpstan/releases/download/2.3.6/phpstan.phar
          php /tmp/phpstan.phar analyse --no-progress --memory-limit=1G

      - name: End-to-end tests
        run: php tests/e2e/run.php
